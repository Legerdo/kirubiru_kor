<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#3971fa"><link rel="icon" href="data:,"><title>건물부수기 · 키루비루</title></head><body>
<main>
  <header><div><span class="eyebrow">斬るビル · 2004</span><h1>건물부수기</h1></div><div class="toolbar"><label class="volume-control" for="volume">볼륨 <input id="volume" type="range" min="0" max="100" step="1" value="100"><output id="volume-value" for="volume">100%</output></label><button id="sound" aria-pressed="false">소리 켜기</button><button id="pause" aria-pressed="false">일시정지</button><button id="fullscreen">전체화면</button></div></header>
  <div class="play-layout">
    <div id="stage" tabindex="0" aria-label="키루비루 게임. 방향키 이동과 점프, 아래키 방어, Z 공격, X 필살기"><div id="loading">원본 리소스를 불러오는 중…</div><div id="pause-overlay" role="status" aria-live="polite" hidden><div><strong>일시정지</strong><span>P 키로도 재개할 수 있습니다.</span><button id="resume" type="button">계속하기</button></div></div></div>
    <aside class="controls" aria-label="조작법"><span><kbd>←</kbd><kbd>→</kbd> 위치 이동</span><span><kbd>↑</kbd> 점프</span><span><kbd>↓</kbd> 방어</span><span><kbd>Z</kbd> 베기 · 확인</span><span><kbd>X</kbd> 필살기</span><span><kbd>P</kbd> 일시정지</span><span><kbd>Esc</kbd> 타이틀</span><span><kbd>−</kbd><kbd>+</kbd> 볼륨</span><span><kbd>M</kbd> 음소거</span></aside>
  </div>
  <div id="touch" aria-label="터치 조작"><div><button data-keys="2" aria-label="왼쪽 이동">←</button><button data-keys="6,1" aria-label="점프">↑</button><button data-keys="4" aria-label="오른쪽 이동">→</button><button data-keys="7,3" aria-label="방어">↓</button></div><div><button data-keys="5,9" class="attack">Z <small>베기 / 확인</small></button><button data-keys="8" class="special">X <small>필살기</small></button></div></div>
  <footer><span><a href="./credits.html" target="_blank" rel="noopener noreferrer" title="원작 출처" aria-label="원작 출처: HORI, liku, sweet tast">HORI · liku · sweet tast © 2004</a></span><span>원본 리소스 · 640 × 480 · 60Hz</span></footer>
  <details><summary>저장 데이터 · 리플레이</summary><div class="storage-panel">
    <p>제공된 원본 세이브에서 시작합니다. 이후 기록은 이 브라우저에 따로 저장됩니다. 타이틀에서 ← →로 제2막·무제한을, ↓ Z로 점수표와 리플레이를 선택할 수 있습니다.</p>
    <div class="storage-actions"><button id="export">웹 저장 파일 내보내기</button><label class="file">저장 파일 가져오기<input id="import" type="file" accept="application/json,.json"></label></div><p id="storage-status" role="status"></p>
  </div></details>
</main><script type="module" src="/src/main.ts"></script></body></html>
